name: campus_connect
description: App-first, multi-tenant campus operating platform reconstruction.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  connectivity_plus: ^6.1.3
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  uuid: ^4.5.1
  drift: ^2.34.2
  sqlite3: ^3.4.0
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.15.1
  drift_dev: ^2.34.4

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
